<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab09 PHP – Formulario</title>
</head>

<body>
    <div class="card">
        <span class="badge">PHP — Semana 09</span>
        <h1>Formulario POST</h1>
        <p class="sub">Los datos se envían a <code>procesar.php</code> mediante HTTP POST.</p>

        <form action="procesar.php" method="POST">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required />

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>

            <button type="submit">Enviar formulario →</button>
        </form>

        <p class="info">
            Servidor: <code>localhost/lab09/</code> &nbsp;|&nbsp; Tecnología: <code>PHP 8.2+</code> &nbsp;|&nbsp; IS093A — UNCP
        </p>
    </div>
</body>

</html>
